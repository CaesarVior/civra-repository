version: "3.8"

services:
  # Application Service (Laravel 13 + PHP 8.3 + Nginx)
  artisantz_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artisantz_app
    restart: always
    ports:
      - "8080:80" # Akses web via port 8080 di server
    depends_on:
      - artisantz_db
    networks:
      - artisantz_network

  # Database Service (MySQL)
  artisantz_db:
    image: mysql:8.0
    container_name: artisantz_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-artisantz}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secretroot}
      MYSQL_USER: ${DB_USERNAME:-artisantz_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secretpass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - artisantz_network

networks:
  artisantz_network:
    driver: bridge

volumes:
  db_data:
