services:
  artisantz_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: artisantz-app:latest
    container_name: artisantz-app
    restart: always
    ports:
      - "8002:80"
    depends_on:
      - artisantz_db
    networks:
      - artisantz_network

  artisantz_db:
    image: mysql:8.0
    container_name: artisantz-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-artisantz}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-7n^Y;9EL)Qk4}
      MYSQL_USER: ${DB_USERNAME:-artisantz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Bismillah123.}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - artisantz_network

networks:
  artisantz_network:
    driver: bridge

volumes:
  db_data:
