services:
  artisantz_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: artisantz-app:latest
    container_name: artisantz-app
    restart: always
    ports:
      - "8002:80"
    env_file:
      - .env
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
    networks:
      - main-mysql-container

networks:
  main-mysql-container:
    external: true
    name: main-mysql-container
