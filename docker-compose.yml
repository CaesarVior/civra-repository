services:
  artisantz_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: artisantz-app:latest
    container_name: artisantz-app
    restart: always
    ports:
      - "8002:80"
    env_file:
      - .env
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
  networks:
    - network-db-staging

networks:
  network-db-staging:
    external: true
    name: network-main-mysql
