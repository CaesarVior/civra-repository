version: "3.8"

services:
  artisantz_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artisantz_app
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - artisantz_db
    networks:
      - artisantz_network

  artisantz_db:
    image: mysql:8.0
    container_name: artisantz_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-artisantz_staging}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-2WTI$pv7O6<^}
      MYSQL_USER: ${DB_USERNAME:-artisantz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Bismillah123.}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - artisantz_network

networks:
  artisantz_network:
    driver: bridge

volumes:
  db_data:
